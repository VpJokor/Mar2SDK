<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2500" viewBox="0 0 1600 2500">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#dc2626"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#7e22ce"/></marker>
<style>
.t{font:700 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}.h{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334155}.x{font:500 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a}.s{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334155}.b{font:700 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#334155}.box{stroke-width:2;rx:13;ry:13}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#a)}.risk{fill:none;stroke:#dc2626;stroke-width:2.5;marker-end:url(#r)}.purple{fill:none;stroke:#7e22ce;stroke-width:2.5;marker-end:url(#p)}
</style></defs>
<rect width="1600" height="2500" fill="#f8fafc"/>
<text x="800" y="52" text-anchor="middle" class="t">Mar2SDK 用户分类逻辑详细流程图</text>
<text x="800" y="80" text-anchor="middle" class="s">代码现状：初始化、本地分类、服务端优先级、异步重判与策略配置</text>
<rect x="55" y="105" width="1490" height="54" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="80" y="138" class="s">颜色：蓝=初始化　红=风险　绿=正常分级　紫=服务端优先级/配置　虚线=异步回流</text>
<rect x="55" y="185" width="900" height="2200" rx="16" fill="#fff" stroke="#cbd5e1"/><rect x="985" y="185" width="560" height="2200" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="220" class="h">主流程</text><text x="1010" y="220" class="h">异步事件与优先级</text>

<rect x="260" y="250" width="490" height="70" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="505" y="281" text-anchor="middle" class="x">Core.init(app, appMod)</text><text x="505" y="304" text-anchor="middle" class="s">应用启动入口</text><path d="M505 320v35" class="line"/>
<rect x="175" y="355" width="660" height="95" class="box" fill="#eff6ff" stroke="#60a5fa"/><text x="505" y="385" text-anchor="middle" class="x">Config.initConfig()</text><text x="505" y="411" text-anchor="middle" class="s">初始化 Preference/DB；读取 UserInfo：收入、network、campaign、riskIP/包/设备</text><text x="505" y="434" text-anchor="middle" class="s">同时加载通用、广告、通知、日志、归因等本地配置</text><path d="M505 450v35" class="line"/>
<rect x="175" y="485" width="660" height="88" class="box" fill="#eff6ff" stroke="#60a5fa"/><text x="505" y="516" text-anchor="middle" class="x">Core.userType 初始值</text><text x="505" y="543" text-anchor="middle" class="s">netUserType ≠ UNKNOW → 服务端类型；否则 → localUserType（默认 NATURE）</text><path d="M505 573v35" class="line"/>
<rect x="145" y="608" width="720" height="100" class="box" fill="#eff6ff" stroke="#60a5fa"/><text x="505" y="638" text-anchor="middle" class="x">初始化各 SDK 与回调</text><text x="505" y="665" text-anchor="middle" class="s">AdIniter、Firebase（启动 RemoteConfig）、Singular（等待首次归因）、Thinking、通知</text><text x="505" y="691" text-anchor="middle" class="s">RiskUtil.init → updateConfig() 注册 RemoteConfig 激活回调</text><path d="M505 708v35" class="line"/>
<rect x="170" y="743" width="670" height="115" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="505" y="774" text-anchor="middle" class="x">judgeRisk()</text><text x="505" y="801" text-anchor="middle" class="s">① judgeRiskIP：riskIP 未知时异步请求 IP</text><text x="505" y="826" text-anchor="middle" class="s">② judgePackage：riskPackage 未知时请求 Play Integrity</text><text x="505" y="851" text-anchor="middle" class="s">③ judgeEcpm → ④ judgeUserType</text><path d="M505 858v35" class="line"/>
<rect x="185" y="893" width="640" height="105" class="box" fill="#e0e7ff" stroke="#4f46e5"/><text x="505" y="925" text-anchor="middle" class="x">judgeEcpm：首条广告收入分桶</text><text x="505" y="953" text-anchor="middle" class="s">-1 → ECPM_UNKNOW；0 → ECPM_0</text><text x="505" y="978" text-anchor="middle" class="s">大于 CommonConfig.highEcpm（默认 10.0）→ ECPM_H；否则 → ECPM_COMMON</text><path d="M505 998v35" class="line"/>
<polygon points="505,1033 700,1105 505,1177 310,1105" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="505" y="1099" text-anchor="middle" class="x">TEST/DEBUG 且 testMod=FORCE？</text><text x="505" y="1125" text-anchor="middle" class="s">是：立即返回，保留调试手动类型</text><path d="M700 1105h130v45" class="line"/><text x="720" y="1092" class="b">是</text><rect x="735" y="1150" width="105" height="48" class="box" fill="#fef3c7" stroke="#d97706"/><text x="787" y="1180" text-anchor="middle" class="s">结束本轮</text><path d="M505 1177v35" class="line"/><text x="520" y="1200" class="b">否</text>
<rect x="160" y="1212" width="690" height="95" class="box" fill="#f1f5f9" stroke="#64748b"/><text x="505" y="1243" text-anchor="middle" class="x">judgeFromLocal：定义 applyUserType()</text><text x="505" y="1270" text-anchor="middle" class="s">只有 netUserType=UNKNOW 才允许 Core.userType=localUserType</text><text x="505" y="1294" text-anchor="middle" class="s">服务端类型已知时，本地结果不覆盖 Core.userType</text><path d="M505 1307v35" class="line"/>
<polygon points="505,1342 710,1415 505,1488 300,1415" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="505" y="1407" text-anchor="middle" class="x">riskIP/包/设备任一 RISK？</text><text x="505" y="1432" text-anchor="middle" class="s">或 ecpmType = ECPM_0？</text><path d="M710 1415h130v40" class="risk"/><text x="730" y="1402" class="b" fill="#dc2626">是</text><rect x="710" y="1455" width="140" height="90" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="780" y="1485" text-anchor="middle" class="x">local=RISK</text><text x="780" y="1510" text-anchor="middle" class="s">同步（若允许）</text><text x="780" y="1533" text-anchor="middle" class="s">立即应用配置并返回</text><path d="M505 1488v35" class="line"/><text x="520" y="1512" class="b">否</text>
<polygon points="505,1523 675,1588 505,1653 335,1588" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="505" y="1583" text-anchor="middle" class="x">network=organic（忽略大小写）</text><text x="505" y="1608" text-anchor="middle" class="s">或 network 为空？</text><path d="M335 1588H205v40" class="line"/><text x="350" y="1577" class="b">是</text><rect x="115" y="1628" width="180" height="62" class="box" fill="#dcfce7" stroke="#15803d"/><text x="205" y="1655" text-anchor="middle" class="x">local=NATURE</text><text x="205" y="1678" text-anchor="middle" class="s">自然量</text><path d="M675 1588h130v40" class="line"/><text x="690" y="1577" class="b">否</text><rect x="715" y="1628" width="180" height="62" class="box" fill="#dcfce7" stroke="#15803d"/><text x="805" y="1655" text-anchor="middle" class="x">local=COMMON</text><text x="805" y="1678" text-anchor="middle" class="s">买量普通</text><path d="M805 1690v30" class="line"/><polygon points="805,1720 900,1760 805,1800 710,1760" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="805" y="1765" text-anchor="middle" class="s">ECPM_H？</text><path d="M900 1760h-5v35" class="line"/><text x="880" y="1745" class="b">是</text><rect x="715" y="1795" width="180" height="58" class="box" fill="#dcfce7" stroke="#15803d"/><text x="805" y="1829" text-anchor="middle" class="x">覆盖为 HIGH_VALUE</text><path d="M710 1760H620v100" class="line"/><text x="635" y="1745" class="b">否</text><path d="M205 1690v170h300M805 1853v7H505" class="line"/><path d="M505 1860v35" class="line"/>
<rect x="145" y="1895" width="720" height="125" class="box" fill="#f1f5f9" stroke="#64748b"/><text x="505" y="1927" text-anchor="middle" class="x">本地分类收尾（非风险分支）</text><text x="505" y="1955" text-anchor="middle" class="s">applyUserType → Thinking.setUserAttr("userType")（仅生效类型等于本地类型时）</text><text x="505" y="1982" text-anchor="middle" class="s">UserInfo.saveUserInfo() → 按 Core.userType 应用 RemoteConfig</text><text x="505" y="2007" text-anchor="middle" class="s">随后调用 judgeUserFromNet()（当前 TODO 空实现）</text><path d="M505 2020v35" class="purple"/>
<rect x="115" y="2055" width="780" height="115" class="box" fill="#f3e8ff" stroke="#7e22ce"/><text x="505" y="2087" text-anchor="middle" class="x">RemoteConfig 应用</text><text x="505" y="2114" text-anchor="middle" class="s">优先读取 ad_config_&lt;类型&gt;、notification_config_&lt;类型&gt;</text><text x="505" y="2141" text-anchor="middle" class="s">再读取 notification_content、common、admob、singular、thinking、log 配置</text><text x="505" y="2163" text-anchor="middle" class="s">空值/解析失败跳过；有效远程值覆盖本地配置</text>

<rect x="1020" y="255" width="490" height="220" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="1265" y="287" text-anchor="middle" class="x">Singular 首次归因回调</text><text x="1045" y="320" class="s">写入 network、campaignId、campaignName</text><text x="1045" y="347" class="s">保存 UserInfo → judgeUserType() 重判</text><text x="1045" y="374" class="s">network=organic/空时标记 fromNature</text><text x="1045" y="414" class="s">改变 network 后可能切换自然量/买量分支</text><path d="M1020 450H930v1160H675" class="dash"/>
<rect x="1020" y="520" width="490" height="285" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="1265" y="552" text-anchor="middle" class="x">IP 风险异步检查</text><text x="1045" y="585" class="s">riskIP 已知或请求进行中 → 直接返回</text><text x="1045" y="612" class="s">请求并解析 IP / ASN / ISP，检查 Cloud/Google 网段</text><text x="1045" y="639" class="s">ISP 含 google 或 ASN 含 15169 → RISK，否则 COMMON</text><text x="1045" y="666" class="s">保存 UserInfo → judgeUserType() 重判</text><text x="1045" y="693" class="s">网络/解析失败 → 保持原值</text><path d="M1020 750H900v665H710" class="risk"/>
<rect x="1020" y="850" width="490" height="270" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="1265" y="882" text-anchor="middle" class="x">Play Integrity 异步检查</text><text x="1045" y="915" class="s">PlayIntegrityID≤0、请求失败 → 保持 UNKNOW</text><text x="1045" y="942" class="s">服务端缺 appIntegrity/包名/版本 → 结束</text><text x="1045" y="969" class="s">UNRECOGNIZED_VERSION → riskPackage=RISK</text><text x="1045" y="996" class="s">标记后调用 judgeUserType() 重判</text><text x="1045" y="1030" class="s">其余 verdict 当前不改变风险值</text><path d="M1020 1060H920v355H710" class="risk"/>
<rect x="1020" y="1165" width="490" height="220" class="box" fill="#fef3c7" stroke="#d97706"/><text x="1265" y="1197" text-anchor="middle" class="x">首条广告收入事件</text><text x="1045" y="1230" class="s">仅 OPEN / INTER / VIDEO 格式参与</text><text x="1045" y="1257" class="s">firstAdRevenue=-1 时写入并持久化</text><text x="1045" y="1284" class="s">调用 judgeRisk()，重跑 IP、包、ECPM、分类</text><text x="1045" y="1317" class="s">收入=0 → ECPM_0 → 命中 RISK</text><path d="M1020 1350H950V800" class="dash"/>
<rect x="1020" y="1430" width="490" height="300" class="box" fill="#f3e8ff" stroke="#7e22ce"/><text x="1265" y="1462" text-anchor="middle" class="x">服务端类型优先级</text><text x="1045" y="1495" class="s">netUserType=UNKNOW：本地类型可更新 Core.userType</text><text x="1045" y="1522" class="s">netUserType≠UNKNOW：服务端类型阻止本地覆盖</text><text x="1045" y="1555" class="s">judgeUserFromNet() 当前为空实现</text><text x="1045" y="1590" class="s">UserType：UNKNOW / RISK / NATURE / COMMON / HIGH_VALUE</text><text x="1045" y="1625" class="s">RiskType：COMMON / RISK / UNKNOW</text><text x="1045" y="1660" class="s">riskDevice 当前仅从 Preference 读取，未发现赋值入口</text>
<rect x="1020" y="1775" width="490" height="220" class="box" fill="#fff" stroke="#94a3b8"/><text x="1265" y="1807" text-anchor="middle" class="x">重判触发总览</text><text x="1045" y="1840" class="s">初始化、Singular 归因、IP 结果、Play Integrity 结果</text><text x="1045" y="1867" class="s">以及首条广告收入，都会再次进入分类逻辑</text><text x="1045" y="1907" class="s">每次重判都重新读取当前风险、network、ECPM 字段</text>
<rect x="55" y="2410" width="1490" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="80" y="2447" class="s">依据：RiskUtil.kt、Core.kt、UserInfo.kt、IPUtil.kt、PlayIntegrityUtil.kt、SingularUtil.kt、LogUtil.kt 及 status 枚举。</text>
</svg>
